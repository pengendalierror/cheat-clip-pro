[package]
name = "cheat-clip"
version = "0.1.0"
edition = "2021"
description = "Lightweight native desktop clipper. The old web app is not linked."

[[bin]]
name = "cheat-clip"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2.10"

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
